<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <script src="script.js" defer></script>
</head>
<body>

  <div class="app-layout d-flex flex-column flex-lg-row min-vh-100">

    <input type="checkbox" id="toggle-form" class="toggle-form-checkbox">

    <label for="toggle-form" class="fab-agregar" aria-label="Agregar tarea">+</label>

    <div class="sidebar d-flex flex-column align-items-center py-4 px-3">
      <div class="sidebar-titulo">
        <h2>Agregar Tarea</h2>
        <label for="toggle-form" class="btn-cerrar-form" aria-label="Cerrar formulario">&times;</label>
      </div>

      <form class="form-tarea" action="#" method="post">
        <div class="campos d-flex flex-column gap-4">

          <div class="campo d-flex flex-column gap-1">
            <label for="titulo" class="form-label mb-0">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Título de la tarea" required>
          </div>

          <div class="campo d-flex flex-column gap-1">
            <label for="categoria" class="form-label mb-0">Categoría</label>
            <select class="form-select" id="categoria" name="categoria" required>
              <option value="">Seleccionar categoría</option>
              <option value="laboral">Laboral</option>
              <option value="estudio">Estudio</option>
              <option value="recordatorio">Recordatorio</option>
            </select>
          </div>

          <div class="campo d-flex flex-column gap-1">
            <label for="telefono" class="form-label mb-0">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: 3815551234" required>
          </div>

          <div class="campo d-flex flex-column gap-1">
            <label for="fecha" class="form-label mb-0">Fecha objetivo</label>
            <input type="date" class="form-control" id="fecha" name="fecha" required>
          </div>

          <div class="campo d-flex flex-column gap-1">
            <label for="hora" class="form-label mb-0">Hora</label>
            <input type="time" class="form-control" id="hora" name="hora">
          </div>

        </div>

        <button type="submit" class="btn btn-crear fw-bold w-100 mt-4">Crear tarea</button>
      </form>
    </div>

    <div class="contenido flex-grow-1 py-4 px-3 px-md-4">
      <h2 class="text-center mb-4">Tareas</h2>

      <div class="filtros d-flex flex-wrap justify-content-center gap-2 mb-4" aria-label="Filtrar tareas por categoría y estado">
        <button type="button" class="filtro activo btn btn-dark" data-filtro="todos">Todos</button>
        <button type="button" class="filtro btn btn-outline-dark" data-filtro="laboral">Laboral</button>
        <button type="button" class="filtro btn btn-outline-dark" data-filtro="estudio">Estudio</button>
        <button type="button" class="filtro btn btn-outline-dark" data-filtro="recordatorio">Recordatorio</button>
        <button type="button" class="filtro-pendiente btn btn-outline-dark" aria-pressed="false">Pendiente</button>
      </div>

      <div class="lista-tareas" aria-label="Listado de tareas"></div>
    </div>

  </div>

</body>
</html>
